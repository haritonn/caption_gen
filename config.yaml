dataset:
  data_path: "./data"
  images_path: "Images"
  captions_file: "captions.txt"
  train_size: 0.8
  val_size: 0.1
  max_caption_length: 50
  min_word_freq: 2
  remove_stopwords: false
  image_size: 224
  normalize_mean: [0.4463, 0.4506, 0.4166]
  normalize_std: [0.2235, 0.2138, 0.2222]
  augmentation:
    random_horizontal_flip: 0.3

model:
  encoder:
    pretrained: false
  decoder:
    embedding_dim: 256
    hidden_dim: 512

training:
  batch_size: 128
  learning_rate: 0.0002
  weight_decay: 0.00001
  num_epochs: 100
  optimizer: "adam"
  scheduler: "step"
  step_size: 25
  gamma: 0.5
  label_smoothing: 0.1
  use_focal_loss: false
  max_sampling_prob: 0.35
  gradient_clipping: 5.0
  attention_regularization: 0.001
  save_checkpoints: true
  checkpoint_dir: "./checkpoints"
  save_every_n_epochs: 5
  early_stopping:
    enabled: true
    patience: 20
    min_epochs: 30

evaluation:
  batch_size: 256

hardware:
  device: "cuda"
  num_workers: 16
  pin_memory: true
  experiment_tracking:
    enabled: true
    project_name: "image_caption_generator"
    experiment_name: null
    log_hyperparameters: true
    log_model_architecture: true
  log_every_n_steps: 100

reproducibility:
  seed: 42
  deterministic: true
