[project]
name = "image-caption-generator"
version = "0.1.0"
description = "Minimal image caption training pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "certifi>=2026.4.22",
    "clearml>=2.0",
    "kagglehub>=1.0.1",
    "nltk>=3.9",
    "numpy>=2.2",
    "pandas>=2.3",
    "pillow>=12.1",
    "pyyaml>=6.0",
    "torch>=2.3",
    "torchvision>=0.18",
    "tqdm>=4.67",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
